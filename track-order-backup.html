<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BBD Campus Food | Track Order</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #2b1b17;
            min-height: 100vh;
        }

        .topbar {
            background: #8b1e2d;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: Georgia, serif;
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            background: #ffd166;
            color: #2b1b17;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 65px 20px 45px;
            background: #fff1dc;
        }

        .label {
            color: #e4572e;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: clamp(42px, 7vw, 70px);
            margin-top: 12px;
        }

        .hero h1 span {
            color: #e4572e;
        }

        .hero p {
            margin-top: 15px;
            color: #76645b;
        }

        .tracker-box {
            max-width: 650px;
            margin: 35px auto 70px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(70, 40, 20, 0.12);
        }

        .tracker-box h2 {
            font-family: Georgia, serif;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #orderId {
            flex: 1;
            padding: 14px 17px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .track-btn {
            border: none;
            background: #e4572e;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .track-btn:hover {
            background: #c94722;
        }

        #message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            display: none;
        }

        .error {
            background: #ffe5e5;
            color: #a40000;
        }

        .loading {
            background: #fff4d6;
            color: #7a5700;
        }

        @media (max-width: 600px) {

            .topbar {
                padding: 15px 20px;
            }

            .brand {
                font-size: 20px;
            }

            .input-row {
                flex-direction: column;
            }

            .track-btn {
                width: 100%;
            }

            .tracker-box {
                margin: 25px 15px 50px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <div class="brand">
            🍔 BBD Campus Food
        </div>

        <a href="index.html" class="back">
            ← Back Home
        </a>

    </header>


    <section class="hero">

        <div class="label">
            ORDER TRACKING
        </div>

        <h1>
            Track Your <span>Order</span>
        </h1>

        <p>
            Enter your Order ID and check the current status of your order.
        </p>

    </section>


    <main class="tracker-box">

        <h2>
            🔎 Enter Order ID
        </h2>

        <div class="input-row">

            <input
                type="text"
                id="orderId"
                placeholder="Enter your Order ID"
            >

            <button
                class="track-btn"
                onclick="trackOrder()"
            >
                Track Order
            </button>

        </div>

        <div id="message"></div>

    </main>


    <script>

        const API = "http://localhost:5000";

        async function trackOrder() {

            const input =
                document.getElementById("orderId");

            const orderId =
                input.value.trim();

            const message =
                document.getElementById("message");


            if (!orderId) {

                message.textContent =
                    "Please enter your Order ID.";

                message.className = "error";

                message.style.display = "block";

                return;
            }


            message.textContent =
                "🔄 Checking your order...";

            message.className = "loading";

            message.style.display = "block";


            try {

                const response = await fetch(
                    `${API}/api/orders/${encodeURIComponent(orderId)}`
                );

                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Order not found."
                    );

                }


                message.textContent =
                    `✅ Order found! Status: ${data.order.status}`;

                message.className = "loading";

            }

            catch (error) {

                message.textContent =
                    "❌ " + error.message;

                message.className = "error";

            }

        }

    </script>

</body>

</html>
