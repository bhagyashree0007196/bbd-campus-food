<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BBD Campus Food | Admin Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #2b1b17;
        }

        .topbar {
            background: #8b1e2d;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-family: Georgia, serif;
            font-size: 28px;
        }

        .brand p {
            margin-top: 4px;
            opacity: 0.8;
            font-size: 13px;
        }

        .back-btn {
            color: #2b1b17;
            background: #ffd166;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 25px;
            font-weight: bold;
        }

        .dashboard {
            max-width: 1250px;
            margin: auto;
            padding: 45px 25px 80px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading p {
            color: #e4572e;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .heading h2 {
            font-family: Georgia, serif;
            font-size: 42px;
            margin-top: 8px;
        }

        .controls {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(70, 40, 20, 0.08);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        select,
        .refresh-btn {
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid #ddd;
            font-weight: bold;
            background: white;
            cursor: pointer;
        }

        .refresh-btn {
            background: #8b1e2d;
            color: white;
            border: none;
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(70, 40, 20, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .order-id {
            color: #8b1e2d;
            font-weight: 800;
            font-size: 18px;
        }

        .status {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .received {
            background: #fff0c2;
        }

        .preparing {
            background: #dbeafe;
        }

        .ready {
            background: #dcfce7;
        }

        .completed {
            background: #e5e7eb;
        }

        .cancelled {
            background: #fee2e2;
        }

        .order-details {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .detail-box {
            background: #fff8ef;
            padding: 15px;
            border-radius: 14px;
        }

        .detail-box small {
            color: #8b7770;
            display: block;
            margin-bottom: 5px;
        }

        .items {
            margin-top: 20px;
        }

        .items h3 {
            margin-bottom: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            margin-top: 15px;
            text-align: right;
            color: #8b1e2d;
            font-size: 22px;
            font-weight: 800;
        }

        .status-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .status-btn:hover {
            transform: translateY(-2px);
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        .error {
            color: #8b1e2d;
        }

        @media (max-width: 750px) {

            .order-details {
                grid-template-columns: 1fr;
            }

            .heading h2 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <h1>🍴 BBD Campus Food</h1>
            <p>Outlet Order Dashboard</p>
        </div>

        <a href="index.html" class="back-btn">
            ← Website
        </a>

    </header>


    <main class="dashboard">

        <div class="heading">

            <p>ADMIN DASHBOARD</p>

            <h2>Incoming Orders</h2>

        </div>


        <div class="controls">

            <select id="outletSelect">

                <option value="nescafe">
                    Nescafé
                </option>

                <option value="mccain">
                    McCain
                </option>

                <option value="ke7">
                    KE7
                </option>

                <option value="dominos">
                    Domino's
                </option>

            </select>


            <button class="refresh-btn" onclick="loadOrders()">
                🔄 Refresh Orders
            </button>

        </div>


        <div id="orders" class="orders">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </main>


    <script>

        const API = "http://localhost:5000";

        const outletSelect =
            document.getElementById("outletSelect");

        const ordersContainer =
            document.getElementById("orders");


        async function loadOrders() {

            const outletKey =
                outletSelect.value;

            ordersContainer.innerHTML =
                `<div class="loading">
                    Loading orders...
                </div>`;


            try {

                const response =
                    await fetch(
                        `${API}/api/outlets/${outletKey}/orders`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not load orders."
                    );

                }


                const orders =
                    data.orders || [];


                if (orders.length === 0) {

                    ordersContainer.innerHTML =
                        `<div class="empty">
                            <h2>No orders yet 🛒</h2>
                            <p>
                                New orders for this outlet
                                will appear here.
                            </p>
                        </div>`;

                    return;
                }


                ordersContainer.innerHTML =
                    orders
                        .map(createOrderCard)
                        .join("");


            } catch (error) {

                console.error(error);

                ordersContainer.innerHTML =
                    `<div class="error">
                        <h2>❌ Could not load orders</h2>
                        <p>
                            Make sure the backend server
                            is running.
                        </p>
                    </div>`;
            }
        }


        function createOrderCard(order) {

            const items =
                order.items
                    .map(item => {

                        return `
                            <div class="item-row">

                                <span>
                                    ${escapeHTML(item.name)}
                                    × ${item.quantity}
                                </span>

                                <strong>
                                    ₹${item.price * item.quantity}
                                </strong>

                            </div>
                        `;

                    })
                    .join("");


            const status =
                order.status || "received";


            const date =
                order.createdAt
                    ? new Date(order.createdAt)
                        .toLocaleString()
                    : "Unknown";


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div>

                            <div class="order-id">
                                ${escapeHTML(order.orderId)}
                            </div>

                            <small>
                                ${date}
                            </small>

                        </div>


                        <span class="status ${status}">
                            ${status.toUpperCase()}
                        </span>

                    </div>


                    <div class="order-details">

                        <div class="detail-box">

                            <small>
                                CUSTOMER
                            </small>

                            <strong>
                                ${escapeHTML(order.customer.name)}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                PHONE
                            </small>

                            <strong>
                                ${escapeHTML(order.customer.phone)}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                COLLEGE
                            </small>

                            <strong>
                                ${escapeHTML(order.customer.college)}
                            </strong>

                        </div>

                    </div>


                    <div class="items">

                        <h3>
                            🍔 Items
                        </h3>

                        ${items}

                    </div>


                    <div class="total">
                        Total: ₹${order.total}
                    </div>


                    <div class="status-controls">

                        <button
                            class="status-btn"
                            onclick="changeStatus('${order.orderId}', 'received')">
                            Received
                        </button>

                        <button
                            class="status-btn"
                            onclick="changeStatus('${order.orderId}', 'preparing')">
                            Preparing
                        </button>

                        <button
                            class="status-btn"
                            onclick="changeStatus('${order.orderId}', 'ready')">
                            Ready
                        </button>

                        <button
                            class="status-btn"
                            onclick="changeStatus('${order.orderId}', 'completed')">
                            Completed
                        </button>

                        <button
                            class="status-btn"
                            onclick="changeStatus('${order.orderId}', 'cancelled')">
                            Cancelled
                        </button>

                    </div>

                </div>

            `;
        }


        async function changeStatus(orderId, status) {

            try {

                const response =
                    await fetch(
                        `${API}/api/orders/${orderId}/status`,
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                status: status
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Status update failed."
                    );
                }


                await loadOrders();


            } catch (error) {

                console.error(error);

                alert(
                    "❌ Could not update order status."
                );

            }
        }


        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        outletSelect.addEventListener(
            "change",
            loadOrders
        );


        loadOrders();

    </script>

</body>

</html>
