<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BBD Campus Food | Menu</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #2b1b17;
        }

        /* TOP BAR */

        .topbar {
            background: #8b1e2d;
            color: white;

            padding: 16px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .cart-button {
            border: none;
            background: #ffd166;
            color: #2b1b17;

            padding: 11px 19px;

            border-radius: 30px;

            font-weight: bold;
            cursor: pointer;
        }

        /* HERO */

        .menu-hero {
            text-align: center;

            padding: 65px 20px 45px;

            background:
                radial-gradient(circle at 10% 20%, #ffd166 0 5%, transparent 5.5%),
                radial-gradient(circle at 90% 70%, #ff8c69 0 7%, transparent 7.5%),
                #fff1dc;
        }

        .menu-label {
            color: #e4572e;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 4px;
        }

        .menu-hero h1 {
            font-family: Georgia, serif;

            font-size: clamp(45px, 7vw, 75px);

            margin-top: 12px;
        }

        .menu-hero h1 span {
            color: #e4572e;
        }

        .menu-description {
            margin-top: 15px;

            color: #76645b;

            font-size: 16px;
        }

        /* CATEGORY BUTTONS */

        .categories {
            display: flex;
            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            padding: 28px 5%;
        }

        .category-btn {
            border: 1px solid #8b1e2d;

            background: white;

            color: #8b1e2d;

            padding: 10px 18px;

            border-radius: 30px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.25s;
        }

        .category-btn:hover {
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: #8b1e2d;
            color: white;
        }

        /* FOOD GRID */

        .menu-grid {
            max-width: 1200px;

            margin: 10px auto 80px;

            padding: 0 25px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 24px;
        }

        /* FOOD CARD */

        .food-card {
            background: white;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(70, 40, 20, 0.08);

            transition: 0.3s;
        }

        .food-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 18px 40px rgba(70, 40, 20, 0.14);
        }

        /* REAL FOOD IMAGE */

        .food-image {
            width: 100%;

            height: 175px;

            overflow: hidden;

            background: #f3e6d8;
        }

        .food-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: 0.4s;
        }

        .food-card:hover .food-image img {
            transform: scale(1.07);
        }

        /* INFO */

        .food-info {
            padding: 20px;
        }

        .food-category {
            color: #e4572e;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .food-card h3 {
            margin-top: 7px;

            font-family: Georgia, serif;

            font-size: 21px;
        }

        .food-bottom {
            margin-top: 18px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .price {
            color: #8b1e2d;

            font-size: 20px;

            font-weight: 800;
        }

        .add-btn {
            border: none;

            background: #8b1e2d;

            color: white;

            padding: 10px 17px;

            border-radius: 25px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .add-btn:hover {
            background: #e4572e;

            transform: translateY(-2px);
        }

        /* CART */

        .cart-panel {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: min(390px, calc(100% - 40px));

            background: white;

            padding: 25px;

            border-radius: 25px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);

            display: none;

            z-index: 1000;
        }

        .cart-panel.show {
            display: block;
        }

        .cart-panel h2 {
            margin-bottom: 15px;
        }

        .cart-item {
            padding: 12px 0;

            border-bottom: 1px solid #eee;

            display: flex;

            justify-content: space-between;
        }

        .remove-btn {
            border: none;

            background: none;

            color: #8b1e2d;

            font-weight: bold;

            cursor: pointer;
        }

        .cart-total {
            margin-top: 18px;

            display: flex;

            justify-content: space-between;

            font-size: 20px;

            font-weight: bold;
        }

        .order-btn {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: none;

            border-radius: 30px;

            background: #e4572e;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        /* MOBILE */

        @media (max-width: 850px) {

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .food-image {
                height: 200px;
            }

        }

    </style>

</head>


<body>


    <div class="topbar">

        <a href="index.html" class="back">
            ← Food Spots
        </a>

        <button class="cart-button" onclick="toggleCart()">
            🛒 Cart
            <span id="cartCount">0</span>
        </button>

    </div>


    <section class="menu-hero">

        <p class="menu-label">
            BBD CAMPUS FOOD GUIDE
        </p>

        <h1 id="outletName">
            Loading...
        </h1>

        <p class="menu-description" id="outletDescription">
        </p>

    </section>


    <div class="categories" id="categories"></div>


    <main class="menu-grid" id="menuGrid"></main>


    <div class="cart-panel" id="cartPanel">

        <h2>🛒 Your Order</h2>

        <div id="cartItems"></div>

        <div class="cart-total">

            <span>Total</span>

            <span id="cartTotal">
                ₹0
            </span>

        </div>

        <button class="order-btn" onclick="placeOrder()">
            PLACE ORDER →
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
